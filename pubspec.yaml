name: porzadmis
description: "PorządMiś – domowy organizer dla całej rodziny."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.13.5

dependencies:
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  firebase_auth: ^7.0.1
  firebase_core: ^5.1.0
  firebase_messaging: ^17.0.1
  fl_chart: ^1.3.0
  flutter:
    sdk: flutter
  flutter_local_notifications: ^22.3.3
  flutter_localizations:
    sdk: flutter
  flutter_riverpod: ^3.4.3
  flutter_svg: ^2.3.2
  go_router: ^18.1.2
  google_sign_in: ^7.2.0
  home_widget: ^0.10.0
  intl: ^0.20.3
  mobile_scanner: ^7.4.2
  qr_flutter: ^4.1.0
  table_calendar: ^3.3.0
  timezone: ^0.11.2
  uuid: ^4.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  generate: true
  assets:
    - assets/themes/
    - assets/icons/
    - assets/images/
  # Nunito (OFL, assets/fonts/OFL.txt) – krój z docs/GUI.md; czcionka zmienna, grubość przez oś wght.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
        - asset: assets/fonts/Nunito-Italic-Variable.ttf
          style: italic
