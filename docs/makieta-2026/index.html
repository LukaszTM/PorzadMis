function topbar(){return `<header class="topbar"><div class="top-context">${icon('home','sm')} <span class="crumb">Nasz dom</span></div><div class="top-actions"><button class="theme-shortcut" data-action="theme-panel" aria-label="Zmień motyw kolorystyczny">${icon('sparkle','sm')} <span>Motywy</span><span class="theme-shortcut-dot" style="background:${theme().accent}"></span></button><span class="demo-tag">Interaktywny prototyp</span><button class="user-chip" data-nav="settings" aria-label="Otwórz ustawienia"><span class="avatar">T</span><span class="top-role">${isAdmin()?'Administrator':'Domownik'}</span></button></div></header>`}
function bottomNav(){const items=[['home','Dziś','home'],['shopping','Zakupy','basket'],['chores','Obowiązki','check-square'],['calendar','Kalendarz','calendar']];const isMore=['notes','budget','members','settings'].includes(s.page);const last=isAdmin()?`<button data-action="more" class="${isMore?'active':''}" aria-label="Więcej"><span class="nav-icon">${icon('menu')}</span><span>Więcej</span></button>`:`<button data-nav="notes" class="${s.page==='notes'?'active':''}"><span class="nav-icon">${assetIcon('notes')}</span><span>Notatki</span></button>`;return `<nav class="bottom-nav" aria-label="Nawigacja mobilna">${items.map(([p,n,i])=>`<button data-nav="${p}" class="${s.page===p?'active':''}"><span class="nav-icon">${assetIcon(p)}</span><span>${n}</span></button>`).join('')}${last}</nav>${s.showMore&&isAdmin()?`<div class="more-scrim" data-action="more"></div><div class="mobile-more"><div class="card-header"><b>Więcej możliwości</b><button class="icon-btn" data-action="more" aria-label="Zamknij">${icon('x','sm')}</button></div><div class="more-list">${navs.slice(4).filter(x=>x[0]!=='budget'||isAdmin()).map(([p,n,i])=>`<button data-nav="${p}">${({home:1,shopping:1,chores:1,calendar:1,notes:1,budget:1}[p]?assetIcon(p):icon(i))} <span>${n}</span></button>`).join('')}</div></div>`:''}`}
const header=(eyebrow,title,sub,action)=>`<div class="page-head"><div><div class="eyebrow">${eyebrow}</div><h1 class="page-title">${title}</h1>${sub?`<p class="page-sub">${sub}</p>`:''}</div>${action||''}</div>`;
const openBtn=(type,label='Dodaj',style='primary')=>`<button type="button" class="btn ${style}" data-open="${type}">${icon('plus','sm')} ${label}</button>`;
const check=(checked,action,id,disabled=false)=>`<button class="check ${checked?'checked':''}" data-action="${action}" data-id="${id}" aria-label="${checked?'Oznacz jako niewykonane':'Oznacz jako wykonane'}" ${disabled?'disabled title="Brak uprawnień do odhaczenia"':''}>${checked?`<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 12l6 6 10-11"/></svg>`:''}</button>`;

function taskRow(t,compact=false){const can=isAdmin()||t.who==='Ty';return `<div class="${compact?'task-row':'task-detail-row'}">${!compact?`<span class="task-symbol">${icon(t.icon||'check-square')}</span>`:''}${check(t.done,'toggle-task',t.id,!can)}<div class="item-body"><div class="item-title ${t.done?'done':''}">${esc(t.title)}</div><div class="item-sub">${compact?`Dziś · ${esc(t.time)} · ${esc(t.who)}`:`${esc(t.repeat||'Jednorazowo')} · ${fmtDate(t.date)} · ${esc(t.time)}`}</div></div>${compact?person(t.who):`<span class="task-person">${person(t.who)} ${esc(t.who)}</span>`}</div>`}
function shopRow(item){return `<div class="shopping-row" data-searchable="${esc((item.name+' '+item.cat).toLowerCase())}">${check(item.checked,'toggle-shop',item.id)}<div class="item-body"><div class="item-title ${item.checked?'done':''}">${esc(item.name)}</div><div class="item-sub">${esc(item.cat)} · dodał/a: ${esc(item.by)}</div></div><span class="qty">${esc(item.qty||'1 szt.')}</span></div>`}
function home(){const my=s.chores.filter(x=>x.who==='Ty'&&x.date===offset(0));const todoShop=s.shopping.filter(x=>!x.checked);const upcoming=s.events.filter(x=>x.date>=offset(0)&&(!x.private||x.by==='Ty')).sort((a,b)=>a.date.localeCompare(b.date)||a.time.localeCompare(b.time)).slice(0,1);const done=my.filter(x=>x.done).length;const first=s.chores.filter(x=>x.date===offset(0)&&x.who==='Ty').slice(0,5);const dateTitle=new Intl.DateTimeFormat('pl-PL',{weekday:'long',day:'numeric',month:'long'}).format(today);return `<div class="home-heading home-hero"><div class="home-hero-copy"><div class="date-overline">${dateTitle}</div><h1 class="page-title">Dzień dobry, Aniu <span class="greeting-sun">☀</span></h1><p class="page-sub">Twój dom ma dziś mały plan. Sprawdź, co przed Wami.</p></div><img class="home-mascot" src="assets/icons/mis-z-domem.png" alt="Uśmiechnięty PorządMiś z domkiem"></div><div class="home-stack"><section class="card priority-card"><div class="card-header"><div><div class="card-title">Dziś do zrobienia</div><div class="card-sub">${done} z ${my.length} Twoich obowiązków wykonanych</div></div><span class="counter-pill">${done}/${my.length}</span></div><div class="progress-track"><div class="progress-fill" style="width:${my.length?done/my.length*100:100}%"></div></div><div class="priority-items">${first.length?first.map(t=>taskRow(t,true)).join(''):empty('Nic do zrobienia. Miś odpoczywa.','Wszystko pod kontrolą.')}</div><button class="card-footer-link" data-nav="chores">Pokaż wszystkie obowiązki ${icon('arrow','sm')}</button></section><div class="home-pair"><section class="card shortcut-card" data-nav="calendar" role="button" tabindex="0"><div class="card-top-icon">${assetIcon('calendar')}</div><div class="card-title">Najbliżej w kalendarzu</div>${upcoming.length?`<div class="upcoming-title">${esc(upcoming[0].title)} ${upcoming[0].private?icon('lock','sm'):''}</div><div class="card-sub">${fmtDate(upcoming[0].date,{day:'numeric',month:'long'})} · ${esc(upcoming[0].time)}</div>`:`${empty('Brak wydarzeń','Zaplanuj coś wspólnie.')}`}<span class="shortcut-arrow">${icon('arrow')}</span></section><section class="card shortcut-card" data-nav="shopping" role="button" tabindex="0"><div class="card-top-icon">${assetIcon('shopping')}</div><div class="card-title">Lista zakupów</div><div class="shortcut-number">${todoShop.length}</div><div class="card-sub">${todoShop.length===1?'produkt do kupienia':'produktów do kupienia'}</div><span class="shortcut-arrow">${icon('arrow')}</span></section></div><div class="activity-line">${icon('users','sm')} <span>Anna dodała „mleko” do wspólnej listy</span></div><button class="btn primary home-add" data-open="quick">${icon('plus','sm')} Dodaj</button></div>`}
function empty(t,sub){return `<div class="empty"><img src="assets/icons/mis-odpoczywa.png" width="108" height="108" alt="Miś odpoczywa"><strong>${t}</strong><div>${sub}</div></div>`}
function shopping(){const todo=s.shopping.filter(x=>!x.checked),done=s.shopping.filter(x=>x.checked);const cats=[...new Set(todo.map(x=>x.cat))];return `${header('Wspólnie','Zakupy','Jedna lista, którą widzi każdy domownik.')}<form class="shopping-add" data-form="shop-inline"><label class="sr-only" for="add-product">Nazwa produktu</label><input id="add-product" name="name" placeholder="Co dopisać? np. chleb" aria-label="Nazwa produktu" required maxlength="70" autocomplete="off"><button class="btn primary" type="submit">${icon('plus','sm')} Dodaj</button></form><section class="card shopping-card"><div class="card-header"><div><div class="card-title">Do kupienia</div><div class="card-sub">Lista wspólna · ${s.members.length} domowników</div></div><span class="counter-pill">${todo.length}</span></div><div id="shop-items">${cats.map(cat=>`<div class="list-section"><div class="list-group-title">${esc(cat)}</div>${todo.filter(x=>x.cat===cat).map(shopRow).join('')}</div>`).join('')||empty('Lista pusta – dopisz pierwszą rzecz.','Każdy domownik zobaczy nowy produkt.')}</div></section><section class="card shopping-card"><div class="card-header"><div><div class="card-title">Kupione</div><div class="card-sub">Możesz przywrócić produkt na listę</div></div>${done.length?`<button class="link" data-action="clear-bought">Wyczyść</button>`:''}</div>${done.length?done.map(shopRow).join(''):empty('Na razie nic kupionego.','Odhaczaj produkty podczas zakupów.')}</section>`}
function chores(){let tasks=s.chores.filter(x=>x.date===s.selectedDate).filter(x=>s.choreView==='mine'?x.who==='Ty':true);const week=['niedz.','pon.','wt.','śr.','czw.','pt.','sob.'];return `${header('Domowe sprawy','Obowiązki','Kto, co i kiedy? Wszystko przejrzyście rozpisane.',isAdmin()?openBtn('task','Nowy obowiązek'):'')}<div class="summary-band"><div><strong>${s.chores.filter(x=>x.date===s.selectedDate&&!x.done).length} obowiązki na wybrany dzień</strong><p>Odhaczaj wykonane zadania jednym dotknięciem.</p></div><span class="pill">${icon('check-square','sm')} ${s.chores.filter(x=>x.done).length} wykonano</span></div><div class="task-datebar">${Array.from({length:7},(_,i)=>{let date=offset(i-2),d=new Date(date+'T12:00:00');return `<button class="day-bubble ${date===s.selectedDate?'active':''} ${date===offset(0)?'today':''}" data-action="select-date" data-value="${date}"><span>${week[d.getDay()]}</span><b>${d.getDate()}</b><span>${date===offset(0)?'Dziś':'·'}</span></button>`}).join('')}</div><div class="card"><div class="toolbar"><div><div class="card-title">${fmtDate(s.selectedDate,{weekday:'long',day:'numeric',month:'long'})}</div><div class="card-sub">Lista obowiązków</div></div><div class="segmented"><button data-action="chore-view" data-value="mine" class="${s.choreView==='mine'?'selected':''}">Moje</button><button data-action="chore-view" data-value="all" class="${s.choreView==='all'?'selected':''}">Wszystkie</button></div></div>${tasks.length?tasks.map(t=>taskRow(t)).join(''):empty('Bez obowiązków','Na ten dzień nic nie zostało zaplanowane.')}${isAdmin()?`<div style="padding-top:15px">${openBtn('task','Zaplanuj obowiązek','soft')}</div>`:''}</div><div class="space-20"></div><div class="card"><div class="card-header"><div><div class="card-title">Jak działają obowiązki?</div><div class="card-sub">Zasady współpracy w domu</div></div>${icon('info')}</div><p class="small-text muted" style="margin:0">Administrator tworzy i przydziela zadania. Domownicy widzą wszystkie, ale odhaczają wyłącznie przypisane sobie. W pełnej aplikacji zadania mogą być cykliczne lub zaplanowane na wybrane dni.</p></div>`}
function allVisibleEvents(){return s.events.filter(e=>!e.private||e.by==='Ty')}
function calCells(){let [y,m]=s.calMonth.split('-').map(Number);let first=new Date(y,m-1,1);let shift=(first.getDay()+6)%7;let start=new Date(y,m-1,1-shift);let cells=[];for(let i=0;i<42;i++){let d=new Date(start);d.setDate(start.getDate()+i);let v=iso(d);let hasEv=allVisibleEvents().some(e=>e.date===v);let hasCh=s.chores.some(e=>e.date===v);cells.push(`<button type="button" class="cal-day ${d.getMonth()!==m-1?'outside':''} ${v===s.selectedDate?'selected':''} ${v===offset(0)?'today':''}" data-action="cal-date" data-value="${v}" aria-label="${fmtDate(v,{day:'numeric',month:'long',year:'numeric'})}"><span>${d.getDate()}</span><span class="cal-dots">${hasEv?'<i></i>':''}${hasCh?'<i class="chore"></i>':''}</span></button>`)}return cells.join('')}
function calendar(){
let events=allVisibleEvents().filter(e=>e.date===s.selectedDate);let chores=s.chores.filter(c=>c.date===s.selectedDate);let all=[...events.map(e=>({...e,kind:'event'})),...chores.map(c=>({...c,kind:'chore'}))].sort((a,b)=>a.time.localeCompare(b.time));const [y,m]=s.calMonth.split('-').map(Number);let monthTitle=new Intl.DateTimeFormat('pl-PL',{month:'long',year:'numeric'}).format(new Date(y,m-1,1));
const agenda=`<section class="card"><div class="card-header"><div><div class="card-title">${fmtDate(s.selectedDate,{weekday:'long',day:'numeric',month:'long'})}</div><div class="card-sub">Plan na wybrany dzień</div></div><span class="pill">${all.length} pozycji</span></div>${all.length?all.map(a=>`<div class="agenda-row"><span class="agenda-time">${esc(a.time)}</span><span class="agenda-marker ${a.kind==='chore'?'chore':''}"></span><div class="item-body"><div class="item-title">${esc(a.title)} ${a.private?icon('lock','sm'):''}</div><div class="item-sub">${a.kind==='event'?'Wydarzenie':'Obowiązek'} · ${esc(a.kind==='event'?a.by:a.who)}${a.place?' · '+esc(a.place):''}</div></div></div>`).join(''):empty('Spokojny dzień','Nie ma nic zaplanowanego.')}<div class="space-20"></div><button class="btn soft" data-open="event">${icon('plus','sm')} Nowe wydarzenie</button></section>`;
let picker='';
if(s.calMode==='month')picker=`<section class="card"><div class="cal-head"><div class="cal-title">${monthTitle}</div><div class="cal-controls"><button class="icon-btn" data-action="cal-prev" aria-label="Poprzedni miesiąc">${icon('chevron-l')}</button><button class="icon-btn" data-action="cal-next" aria-label="Następny miesiąc">${icon('chevron-r')}</button></div></div><div class="cal-week">${['Pon','Wt','Śr','Czw','Pt','Sob','Niedz'].map(d=>`<span>${d}</span>`).join('')}</div><div class="cal-days">${calCells()}</div><div class="legend"><span><i class="dot" style="display:inline-block;background:var(--chart2);margin-right:6px"></i> Wydarzenia</span><span><i class="dot" style="display:inline-block;background:var(--accent);margin-right:6px"></i> Obowiązki</span></div></section>`;
if(s.calMode==='week'){let anchor=new Date(s.selectedDate+'T12:00:00');let monday=new Date(anchor);monday.setDate(anchor.getDate()-((anchor.getDay()+6)%7));picker=`<section class="card"><div class="cal-head"><div class="cal-title">Tydzień ${fmtDate(iso(monday),{day:'numeric',month:'long'})}</div><div class="cal-controls"><button class="icon-btn" data-action="week-prev">${icon('chevron-l')}</button><button class="icon-btn" data-action="week-next">${icon('chevron-r')}</button></div></div><div class="task-datebar" style="flex-wrap:wrap">${Array.from({length:7},(_,i)=>{let d=new Date(monday);d.setDate(d.getDate()+i);let v=iso(d);return `<button class="day-bubble ${v===s.selectedDate?'active':''}" data-action="cal-date" data-value="${v}"><span>${['Pon','Wt','Śr','Czw','Pt','Sob','Niedz'][i]}</span><b>${d.getDate()}</b><span>${allVisibleEvents().some(x=>x.date===v)?'●':'·'}</span></button>`}).join('')}</div><p class="small-text muted">Wybierz dzień, aby zobaczyć zaplanowane wydarzenia i obowiązki.</p></section>`}
if(s.calMode==='day')picker=`<section class="card"><div class="cal-head"><div class="cal-title">${fmtDate(s.selectedDate,{weekday:'long',day:'numeric',month:'long'})}</div><div class="cal-controls"><button class="icon-btn" data-action="day-prev">${icon('chevron-l')}</button><button class="icon-btn" data-action="day-next">${icon('chevron-r')}</button></div></div><div class="welcome-art" style="height:145px;margin-bottom:13px">${icon('calendar')}</div><p class="small-text muted">Jeden dzień, wszystkie sprawy w zasięgu ręki.</p><button class="btn soft" data-action="cal-today">${icon('clock','sm')} Przejdź do dzisiaj</button></section>`;
return `${header('Wspólne plany','Kalendarz domowy','Wydarzenia i obowiązki wszystkich domowników w jednym widoku.',openBtn('event','Dodaj wydarzenie'))}<div class="toolbar"><div class="segmented"><button data-action="cal-mode" data-value="month" class="${s.calMode==='month'?'selected':''}">Miesiąc</button><button data-action="cal-mode" data-value="week" class="${s.calMode==='week'?'selected':''}">Tydzień</button><button data-action="cal-mode" data-value="day" class="${s.calMode==='day'?'selected':''}">Dzień</button></div><button class="btn secondary small" data-action="cal-today">Dzisiaj</button></div><div class="calendar-layout">${picker}${agenda}</div>`
}
function notes(){let notes=s.notes.filter(x=>!x.private||x.by==='Ty').filter(x=>s.noteView==='all'||(s.noteView==='private'?x.private:!x.private)).sort((a,b)=>Number(b.pin)-Number(a.pin));return `${header('Wszystko zapisane','Notatki','Pomysły, ważne informacje i drobne przypomnienia.',openBtn('note','Nowa notatka'))}<div class="toolbar"><div class="segmented"><button data-action="note-view" data-value="all" class="${s.noteView==='all'?'selected':''}">Wszystkie</button><button data-action="note-view" data-value="shared" class="${s.noteView==='shared'?'selected':''}">Wspólne</button><button data-action="note-view" data-value="private" class="${s.noteView==='private'?'selected':''}">${icon('lock','sm')} Prywatne</button></div><div class="search">${icon('search','sm')}<input id="noteSearch" placeholder="Szukaj notatki..." value="${esc(s.searchNote)}" aria-label="Szukaj notatki"></div></div><section class="notes-grid">${notes.map(n=>`<article class="note-card tone-${n.tone}" data-searchable="${esc((n.title+' '+n.body).toLowerCase())}" data-action="open-note" data-id="${n.id}" tabindex="0" role="button" aria-label="Otwórz ${esc(n.title)}"><div class="note-top">${n.private?`<span class="pill">${icon('lock','sm')} Tylko ja</span>`:`<span class="pill muted">${icon('users','sm')} Wspólna</span>`}${n.pin?icon('pin','sm'):''}</div><h3 class="note-heading">${esc(n.title)}</h3><p class="note-preview" style="margin:0">${esc(n.body)}</p><div class="note-bottom"><span>${esc(n.by==='Ty'?'Moja notatka':n.by)}</span><span>${icon('arrow','sm')}</span></div></article>`).join('')}</section>${!notes.length?empty('Nie ma jeszcze notatek','Dodaj coś, co warto zapamiętać.'):''}`}
function budget(){if(!isAdmin()){s.page='home';return home()}
let monthExpenses=s.expenses.filter(e=>e.date.startsWith(s.budgetMonth));let sum=monthExpenses.reduce((a,x)=>a+x.amount,0),totalPlan=categories.reduce((a,x)=>a+x.limit,0),spent=categories.map(c=>({...c,spent:monthExpenses.filter(e=>e.cat===c.name).reduce((a,x)=>a+x.amount,0)})).filter(x=>x.spent>0);
let degree=0;let gradients=spent.map(x=>{const p=sum?x.spent/sum*360:0,from=degree;degree+=p;return `${x.color} ${from}deg ${degree}deg`}).join(', ');
let [year,month]=s.budgetMonth.split('-').map(Number),monthTitle=new Intl.DateTimeFormat('pl-PL',{month:'long',year:'numeric'}).format(new Date(year,month-1,1));let filtered=monthExpenses.filter(e=>s.budgetCat==='all'||e.cat===s.budgetCat);
return `${header('Finanse w równowadze','Budżet','<span class="pill private">'+icon('lock','sm')+' Tylko Administrator</span>',openBtn('expense','Dodaj wydatek'))}
<div class="toolbar"><div class="cal-controls"><button class="icon-btn" data-action="budget-prev" aria-label="Poprzedni miesiąc">${icon('chevron-l')}</button><div class="pill" style="font-size:13px;padding:10px 15px;text-transform:capitalize">${monthTitle}</div><button class="icon-btn" data-action="budget-next" aria-label="Następny miesiąc">${icon('chevron-r')}</button></div><button class="btn secondary small" data-action="budget-today">Bieżący miesiąc</button></div>
<section class="budget-overview"><div class="big-stat"><div class="label">Wydano w miesiącu</div><div class="value">${money(sum)}</div><div class="foot">Zapisane wydatki</div></div><div class="big-stat"><div class="label">Plan miesięczny</div><div class="value">${money(totalPlan)}</div><div class="foot">Limit wszystkich kategorii</div></div><div class="big-stat"><div class="label">Pozostało w planie</div><div class="value" style="color:var(--accent-ink)">${money(totalPlan-sum)}</div><div class="foot">${Math.round(sum/totalPlan*100)}% wykorzystane</div></div></section>
<div class="grid-2"><section class="card"><div class="card-header"><div><div class="card-title">Struktura wydatków</div><div class="card-sub">Wybierz kategorię, aby przefiltrować listę</div></div><span class="pill">${monthTitle}</span></div><div class="donut-wrap"><div class="donut" style="background:conic-gradient(${gradients||'var(--border) 0deg 360deg'})"><div class="donut-inner"><strong>${money(sum)}</strong><span>łączne wydatki</span></div></div><div class="budget-legend">${spent.map(c=>`<button class="budget-legend-btn ${s.budgetCat===c.name?'selected':''}" data-action="budget-category" data-value="${esc(c.name)}"><span><i style="background:${c.color}"></i>${c.name}</span><b>${sum?Math.round(c.spent/sum*100):0}%</b></button>`).join('')||`<div class="small-text muted">Brak wydatków w tym miesiącu.</div>`}</div></div></section><section class="card"><div class="card-header"><div><div class="card-title">Plan kategorii</div><div class="card-sub">Zestawienie wydatki / limit</div></div>${icon('trending')}</div>${categories.slice(0,5).map(c=>{let n=monthExpenses.filter(e=>e.cat===c.name).reduce((a,x)=>a+x.amount,0);let pct=n/c.limit*100;return `<div class="budget-cat"><div class="budget-cat-top"><strong>${esc(c.name)}</strong><span class="budget-cat-right">${money(n)} / ${money(c.limit)}</span></div><div class="progress-track"><div class="progress-fill" style="width:${Math.min(100,pct)}%;background:${pct>=100?'var(--danger)':pct>=80?'var(--warning)':c.color}"></div></div></div>`}).join('')}</section></div><div class="space-20"></div><section class="card"><div class="card-header"><div><div class="card-title">Wydatki · ${monthTitle}</div><div class="card-sub">${s.budgetCat==='all'?'Wszystkie kategorie':s.budgetCat} · ${filtered.length} pozycji</div></div><button class="btn secondary small" data-action="budget-category" data-value="all">Pokaż wszystkie</button></div>${filtered.map(e=>`<div class="expense-row"><span class="exp-icon">${icon(categories.find(c=>c.name===e.cat)?.icon||'wallet')}</span><span class="item-body"><div class="item-title">${esc(e.title)}</div><div class="item-sub">${esc(e.cat)} · ${fmtDate(e.date)} · ${esc(e.by)}</div></span><span class="exp-value">−${money(e.amount)}</span></div>`).join('')||empty('Brak wydatków','Dodaj pierwszy wydatek lub zmień filtr.')}</section>`
}
function members(){return `${header('Razem łatwiej','Domownicy','Wasz wspólny dom — jedna przestrzeń, różne uprawnienia.',isAdmin()?`<button class="btn primary" data-open="invite">${icon('qr','sm')} Zaproś osobę</button>`:'')}<div class="summary-band"><div><strong>Nasz dom</strong><p>${s.members.length} domowników · ${s.members.filter(x=>x.role==='admin').length} administratorów</p></div><span class="pill">${icon('home','sm')} Wspólna przestrzeń</span></div><div class="people-grid">${s.members.map(p=>`<div class="card person-card"><div class="avatar" style="${p.name==='Anna'?'background:#FCE4E8;color:#AC496C':p.name==='Marek'?'background:#DDECF6;color:#33678B':''}">${p.initial}</div><div class="person-name">${esc(p.name==='Ty'?'Ty (Twoje konto)':p.name)}</div><div class="person-role">${p.role==='admin'?'Administrator':'Domownik'}</div><span class="pill ${p.role==='admin'?'':'muted'}">${p.role==='admin'?icon('check','sm'):icon('users','sm')} ${p.role==='admin'?'Zarządzanie domem':'Dostęp wspólny'}</span>${isAdmin()&&p.id!=='you'?`<button class="btn secondary small" style="margin-top:6px" data-action="switch-member-role" data-id="${p.id}">${p.role==='admin'?'Zmień na domownika':'Nadaj rolę admina'}</button>`:''}</div>`).join('')}</div><div class="space-20"></div><div class="card"><div class="card-header"><div><div class="card-title">Prywatność i uprawnienia</div><div class="card-sub">Zaprojektowane z myślą o rodzinie</div></div>${icon('lock')}</div><p class="small-text muted" style="margin:0">W docelowej aplikacji notatki i wydarzenia „Tylko ja” pozostają prywatne nawet wobec Administratora. Budżet nie jest wysyłany na urządzenia Domowników. Wersja demonstracyjna pokazuje te zasady wyłącznie w interfejsie.</p></div>`}
function settings(){let preview=theme();return `${header('Po Twojemu','Ustawienia','Dopasuj wygląd i działanie PorządMisia do swoich potrzeb.')}<div class="settings-grid"><div><section class="card settings-section"><div class="card-header"><div><div class="card-title">Motyw aplikacji</div><div class="card-sub">13 palet do wyboru · podgląd na żywo</div></div>${icon('sparkle')}</div><div class="theme-groups">${[["PorządMiś",THEMES.slice(0,2)],["Inspirowane PyCharm",THEMES.slice(2,10)],["Różowe",THEMES.slice(10)]].map(([group,items])=>`<div class="theme-group"><div class="list-group-title">${group}</div><div class="theme-grid">${items.map(t=>`<button class="theme-tile ${preview.id===t.id?'active':''}" data-action="theme-preview" data-value="${t.id}" aria-label="Motyw ${esc(t.name)}"><div class="theme-palette" style="background:${t.bg};border:1px solid ${t.border}"><i style="background:${t.surface}"></i><i style="background:${t.accent}"></i><i style="background:${t.text}"></i></div><div class="theme-name">${t.name}</div></button>`).join('')}</div></div>`).join('')}</div><div class="theme-apply"><span class="tiny-label">${s.previewTheme&&s.previewTheme!==s.theme?'Podgląd niezapisany':'Aktualny motyw'}</span><button class="btn primary small" data-action="theme-save" ${!s.previewTheme||s.previewTheme===s.theme?'disabled':''}>Zastosuj motyw</button></div></section><section class="card settings-section"><div class="card-header"><div><div class="card-title">Powiadomienia</div><div class="card-sub">Decyduj, o czym chcesz wiedzieć</div></div>${icon('bell')}</div>${[['chores','Przypomnienia o obowiązkach','Przydzielone zadania i terminy','check-square'],['events','Wydarzenia','Przypomnienia z kalendarza','calendar'],['shopping','Zmiany listy zakupów','Nowe pozycje od domowników','basket'],['joined','Nowi domownicy','Ktoś dołączył do domu','users'],...(isAdmin()?[['budget','Alerty budżetu','Po przekroczeniu 80% i 100% limitu','wallet']]:[])].map(([id,n,d,i])=>`<div class="setting-row"><span class="setting-icon">${icon(i)}</span><div class="setting-copy">${n}<div class="setting-desc">${d}</div></div><button class="toggle ${s.notifications[id]?'on':''}" data-action="toggle-notification" data-value="${id}" role="switch" aria-checked="${s.notifications[id]}" aria-label="${n}"></button></div>`).join('')}</section><section class="card"><div class="card-header"><div class="card-title">Wygoda korzystania</div>${icon('settings')}</div><div class="setting-row"><span class="setting-icon">${icon('note')}</span><div class="setting-copy">Większy tekst<div class="setting-desc">Nieco większa czcionka podstawowa</div></div><button class="toggle ${s.textLarge?'on':''}" data-action="toggle-text" role="switch" aria-checked="${s.textLarge}"></button></div><div class="setting-row"><span class="setting-icon">${icon('users')}</span><div class="setting-copy">Podgląd roli<div class="setting-desc">Przełącz uprawnienia makiety</div></div><button class="btn secondary small" data-action="toggle-role">${isAdmin()?'Zobacz jako Domownik':'Zobacz jako Admin'}</button></div><div class="setting-row"><span class="setting-icon">${icon('sparkle')}</span><div class="setting-copy">Ekran powitalny<div class="setting-desc">Zobacz kreator pierwszego uruchomienia</div></div><button class="btn secondary small" data-open="welcome">Otwórz</button></div><div class="setting-row"><span class="setting-icon">${icon('trash')}</span><div class="setting-copy">Przywróć dane przykładowe<div class="setting-desc">Reset zmian wykonanych w makiecie</div></div><button class="btn danger small" data-action="reset">Reset</button></div></section></div><div><section class="card"><div class="card-header"><div><div class="card-title">Podgląd wyglądu</div><div class="card-sub">Aktualnie wybrana paleta</div></div></div><div class="mock-phone"><div class="phone-hole"></div><div class="phone-mini-heading">Witaj w domu! ☀</div><div class="phone-mini-hero">Wszystko pod kontrolą.</div><div class="phone-mini-card"><i class="phone-mini-dot"></i><i class="phone-mini-line"></i></div><div class="phone-mini-card"><i class="phone-mini-dot"></i><i class="phone-mini-line" style="width:53%"></i></div></div><div class="small-text muted" style="text-align:center">${esc(preview.name)}</div></section><div class="space-20"></div><section class="card"><div class="card-title">Informacje o aplikacji</div><p class="small-text muted">Interaktywny projekt GUI zgodny z założeniami PorządMisia. Obejmuje widoki i przykładowe działania. Nie jest gotową aplikacją Flutter ani nie synchronizuje danych.</p><span class="pill">Wersja demonstracyjna 1.0</span></section></div></div>`}
function themeDrawerMarkup(){if(!themeDrawer)return '';const chosen=theme();const groups=[['Firmowe',THEMES.slice(0,2)],['Inspirowane PyCharm',THEMES.slice(2,10)],['Różowe',THEMES.slice(10)]];return `<div class="palette-scrim" data-action="theme-cancel"></div><section class="palette-drawer" role="dialog" aria-modal="true" aria-label="Wybór motywu kolorystycznego"><div class="palette-head"><div class="palette-kicker">WYGLĄD APLIKACJI</div><h2>Wybierz swój kolor</h2><p>Dotknij palety, aby zobaczyć zmianę całego interfejsu.</p></div><button class="palette-close" data-action="theme-cancel" aria-label="Zamknij wybór motywów">${icon('x')}</button><div class="palette-scroll">${groups.map(([label,items])=>`<div class="palette-group"><h3>${label}</h3><div class="palette-grid">${items.map(t=>`<button type="button" class="palette-option ${chosen.id===t.id?'is-selected':''}" data-action="theme-preview" data-value="${t.id}" aria-pressed="${chosen.id===t.id}" aria-label="Podgląd motywu ${esc(t.name)}"><span class="palette-swatch" style="background:${t.bg};border:1px solid ${t.border}"><i style="background:${t.surface}"></i><i style="background:${t.accent}"></i><i style="background:${t.text}"></i></span><span class="palette-option-name">${t.name}</span>${chosen.id===t.id?`<span class="palette-check">${icon('check')}</span>`:''}</button>`).join('')}</div></div>`).join('')}</div></div><div class="palette-bottom"><div><small>Podgląd motywu</small><strong>${chosen.name}</strong></div><button class="btn primary" data-action="theme-apply-close">Zastosuj</button></div></section>`}
function render(){if(s.page==='budget'&&!isAdmin())s.page='home';useTheme();const pages={home,shopping,chores,calendar,notes,budget,members,settings};root.innerHTML=`<div class="app">${sidebar()}<main class="main">${topbar()}${pages[s.page]()}</main></div>${bottomNav()}${modal?renderModal():''}${themeDrawerMarkup()}`;persist();applySearches();if(themeDrawer){const scroll=document.querySelector('.palette-scroll');if(scroll)scroll.scrollTop=paletteScrollY}}
function applySearches(){for(let [id,needle] of [['shop-items',s.searchShop],['root',s.searchNote]]){if(id==='root'&&s.page!=='notes')continue;if(id==='shop-items'&&s.page!=='shopping')continue;let el=document.getElementById(id);el?.querySelectorAll(id==='root'?'.note-card':'.shopping-row').forEach(row=>row.style.display=row.dataset.searchable.includes((needle||'').toLowerCase())?'':'none')}}
const modalShell=(title,subtitle,body,wide=false)=>`<div class="modal-layer" id="modalLayer"><section class="modal ${wide?'wide':''}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><div><div class="modal-title">${title}</div><div class="modal-sub">${subtitle}</div></div><button class="icon-btn" data-action="close-modal" aria-label="Zamknij">${icon('x')}</button></div>${body}</section></div>`;
const field=(name,label,type='text',value='',extra='')=>`<div class="field"><label for="f-${name}">${label}</label><input id="f-${name}" name="${name}" type="${type}" value="${esc(value)}" ${extra}></div>`;
const sel=(name,label,opts)=>`<div class="field"><label for="f-${name}">${label}</label><select id="f-${name}" name="${name}">${opts.map(([v,n])=>`<option value="${esc(v)}">${esc(n)}</option>`).join('')}</select></div>`;
const submit=(label)=>`<div class="modal-actions"><button class="btn secondary" type="button" data-action="close-modal">Anuluj</button><button class="btn primary" type="submit">${icon('check','sm')} ${label}</button></div>`;
function fakeQR(){let html='';for(let y=0;y<21;y++)for(let x=0;x<21;x++){let finder=(sx,sy)=>{let xx=x-sx,yy=y-sy;return xx>=0&&xx<7&&yy>=0&&yy<7?(xx===0||xx===6||yy===0||yy===6||(xx>=2&&xx<=4&&yy>=2&&yy<=4)):null};let f=finder(0,0);if(f===null)f=finder(14,0);if(f===null)f=finder(0,14);let black=f===null?((x*131+y*73+x*y*11)%13<6):f;html+=`<i class="${black?'black':''}"></i>`}return html}
function renderModal(){let type=modal.type;let m=modal;if(type==='quick')return modalShell('Co chcesz dodać?','Wybierz rodzaj nowego wpisu.',`<div class="quick-actions"><button class="quick-card" data-open="shop">${icon('basket','lg')} Produkt</button>${isAdmin()?`<button class="quick-card" data-open="task">${icon('check-square','lg')} Obowiązek</button>`:''}<button class="quick-card" data-open="note">${icon('note','lg')} Notatka</button><button class="quick-card" data-open="event">${icon('calendar','lg')} Wydarzenie</button>${isAdmin()?`<button class="quick-card" data-open="expense">${icon('wallet','lg')} Wydatek</button>`:''}</div>`);
if(type==='shop')return modalShell('Dodaj produkt','Nowa pozycja na wspólnej liście zakupów.',`<form data-form="shop">${field('name','Nazwa produktu','text','','placeholder="Np. masło" required maxlength="70"')}<div class="field-grid">${field('qty','Ilość i jednostka','text','1 szt.','maxlength="30"')}${sel('cat','Kategoria',[['Nabiał','Nabiał'],['Pieczywo','Pieczywo'],['Warzywa i owoce','Warzywa i owoce'],['Dom','Dom'],['Inne','Inne']])}</div>${submit('Dodaj do listy')}</form>`);
if(type==='task')return modalShell('Nowy obowiązek','Zaplanuj zadanie domowe.',!isAdmin()?`<div class="hint">Obowiązki może tworzyć tylko Administrator.</div>`:`<form data-form="task">${field('title','Nazwa obowiązku','text','','required maxlength="80"')}<div class="field-grid">${sel('who','Przypisz',[['Ty','Ty'],['Anna','Anna'],['Marek','Marek']])}${field('date','Termin','date',s.selectedDate)}</div><div class="field-grid">${field('time','Godzina','time','10:00')}${sel('repeat','Powtarzanie',[['Jednorazowo','Jednorazowo'],['Codziennie','Codziennie'],['Co tydzień','Co tydzień'],['Co miesiąc','Co miesiąc']])}</div><div class="hint">Makieta zapisuje jedno wystąpienie. Pełna aplikacja będzie obsługiwać także reguły cykliczne oraz wybrane daty.</div>${submit('Dodaj obowiązek')}</form>`);
if(type==='event')return modalShell('Nowe wydarzenie','Zapisz wydarzenie w kalendarzu.',`<form data-form="event">${field('title','Nazwa wydarzenia','text','','required maxlength="100"')}<div class="field-grid">${field('date','Data','date',s.selectedDate)}${field('time','Godzina','time','14:00')}</div>${field('place','Miejsce (opcjonalnie)','text','','maxlength="100"')}${sel('visibility','Widoczność',[['shared','Wszyscy w domu'],['private','Tylko ja']])}${submit('Zapisz wydarzenie')}</form>`);
if(type==='note')return modalShell('Nowa notatka','Zapisz coś, o czym warto pamiętać.',`<form data-form="note">${field('title','Tytuł','text','','required maxlength="80"')}<div class="field"><label for="f-body">Treść notatki</label><textarea id="f-body" name="body" required maxlength="3000" placeholder="Twoja notatka..."></textarea></div>${sel('visibility','Widoczność',[['shared','Wszyscy w domu'],['private','Tylko ja']])}${submit('Zapisz notatkę')}</form>`);
if(type==='expense')return modalShell('Dodaj wydatek','Wydatki widzą tylko Administratorzy.',!isAdmin()?'<p>Brak dostępu.</p>':`<form data-form="expense">${field('title','Opis wydatku','text','','required maxlength="80"')}<div class="field-grid">${field('amount','Kwota w PLN','number','','required min="0.01" step="0.01" placeholder="0,00"')}${field('date','Data','date',offset(0))}</div>${sel('cat','Kategoria',categories.map(c=>[c.name,c.name]))}${submit('Zapisz wydatek')}</form>`);
if(type==='invite')return modalShell('Zaproś domownika','Zaproszenie to demonstracja interfejsu.',`<div class="qr-grid" aria-label="Dekoracyjny wzór przypominający kod QR, nieaktywny">${fakeQR()}</div><div class="invite-code">DOM123</div><div style="display:flex;justify-content:center"><button class="btn secondary small" data-action="copy-invite">${icon('copy','sm')} Kopiuj kod</button></div><div class="hint">Ten kod i wzór QR są przykładowe — nie umożliwiają dołączenia. W pełnej aplikacji zaproszenie będzie ważne 24 godziny i zweryfikowane na serwerze.</div>`);
if(type==='viewnote'){let n=s.notes.find(x=>x.id===m.id);if(!n)return '';let can=n.by==='Ty'||isAdmin()&&!n.private;return modalShell(esc(n.title),`${n.private?'Prywatna · Tylko ja':'Wspólna'} · autor: ${esc(n.by)}`,`<div style="white-space:pre-line;font-size:14px;line-height:1.9;padding:8px 0 15px">${esc(n.body)}</div><div class="modal-actions"><button class="btn secondary" data-action="pin-note" data-id="${n.id}">${icon('pin','sm')} ${n.pin?'Odepnij':'Przypnij'}</button>${can?`<button class="btn primary" data-action="edit-note" data-id="${n.id}">${icon('edit','sm')} Edytuj</button>`:''}</div>`)}
if(type==='editnote'){let n=s.notes.find(x=>x.id===m.id);if(!n)return '';return modalShell('Edytuj notatkę','Zmiany zostaną zapisane lokalnie.',`<form data-form="editnote" data-id="${n.id}">${field('title','Tytuł','text',n.title,'required maxlength="80"')}<div class="field"><label for="f-body">Treść</label><textarea id="f-body" name="body" required maxlength="3000">${esc(n.body)}</textarea></div>${sel('visibility','Widoczność',n.private?[['private','Tylko ja'],['shared','Wszyscy w domu']]:[['shared','Wszyscy w domu'],['private','Tylko ja']])}<div class="modal-actions"><button type="button" class="btn danger" data-action="delete-note" data-id="${n.id}">${icon('trash','sm')} Usuń</button><button class="btn primary" type="submit">Zapisz zmiany</button></div></form>`)}
if(type==='notifications')return modalShell('Powiadomienia','Przykładowe informacje dla Twojego domu.',`<div class="event-strip"><span class="event-bar"></span><div class="event-strip-body"><div class="event-strip-title">Obowiązki na dziś</div><div class="event-strip-meta">Sprawdź, co zostało do zrobienia.</div></div></div><div class="event-strip"><span class="event-bar purple"></span><div class="event-strip-body"><div class="event-strip-title">Wspólny kalendarz</div><div class="event-strip-meta">Przejrzyj najbliższe wydarzenia.</div></div></div><div class="hint">Prawdziwe powiadomienia push będą dostępne po podłączeniu Firebase.</div>`);
if(type==='welcome'){let st=m.step||0;let titles=['Cześć, jestem PorządMiś','Pomagam ogarnąć dom razem z rodziną','Dołącz do domu albo załóż nowy'];let bodies=['Ważne domowe sprawy w jednym miejscu.','Wspólne zakupy, obowiązki i kalendarz.','Porządek zaczyna się od małego kroku.'];return modalShell('Pierwsze uruchomienie','Krótki spacer po aplikacji.',`<div class="welcome-art"><img src="assets/mis.svg" alt="PorządMiś" width="116" height="116"></div><div style="font-size:19px;font-weight:820;letter-spacing:-.5px">${titles[st]}</div><p class="muted" style="font-size:13px">${bodies[st]}</p><div class="welcome-steps">${[0,1,2].map(x=>`<span class="${st===x?'current':''}"></span>`).join('')}</div><div class="modal-actions">${st?`<button class="btn secondary" data-action="welcome-prev">Wstecz</button>`:''}<button class="btn primary" data-action="welcome-next">${st===2?'Zaczynamy':'Dalej'} ${icon('arrow','sm')}</button></div>`)}return ''}
function notify(msg){document.querySelector('.toast')?.remove();const e=document.createElement('div');e.className='toast';e.setAttribute('role','status');e.innerHTML='<img src="assets/brand/mis-logo-384.png" alt="" width="26" height="26"><span>'+esc(msg)+'</span>';if(/błąd|brak uprawnień|możesz odhaczać|wpisz|podaj prawidłową/i.test(msg)){e.textContent=msg;e.classList.add('toast-error')}document.body.appendChild(e);clearTimeout(toastTimer);toastTimer=setTimeout(()=>e.remove(),3000)}
function go(p){s.page=p;s.showMore=false;s.previewTheme=null;themeDrawer=false;s.searchShop='';s.searchNote='';modal=null;window.scrollTo({top:0,behavior:'instant'});render()}
function act(name,el){const id=Number(el.dataset.id),v=el.dataset.value;switch(name){case 'theme-panel':themeDrawer=true;paletteScrollY=0;s.previewTheme=null;render();break;case 'theme-cancel':themeDrawer=false;s.previewTheme=null;render();break;case 'theme-apply-close':s.theme=(s.previewTheme||s.theme);s.previewTheme=null;themeDrawer=false;render();notify('Zastosowano motyw');break;case 'more':s.showMore=!s.showMore;render();break;case 'close-modal':modal=null;s.previewTheme=null;render();break;case 'notifications':modal={type:'notifications'};render();break;case 'toggle-shop':{let x=s.shopping.find(x=>x.id===id);if(x){x.checked=!x.checked;render();notify(x.checked?'Produkt odhaczony':'Produkt wrócił na listę')}break}case 'shop-view':s.shopView=v;render();break;case 'clear-bought':if(confirm('Wyczyścić kupione produkty z listy?')){s.shopping=s.shopping.filter(x=>!x.checked);render();notify('Kupione produkty usunięte')}break;case 'toggle-task':{let x=s.chores.find(x=>x.id===id);if(x){if(!isAdmin()&&x.who!=='Ty'){notify('Możesz odhaczać tylko swoje obowiązki');break}x.done=!x.done;render();notify(x.done?'Obowiązek wykonany':'Oznaczono jako niewykonane')}break}case 'cal-mode':s.calMode=v;render();break;case 'cal-today':s.selectedDate=offset(0);s.calMonth=s.selectedDate.slice(0,7);render();break;case 'day-prev':case 'day-next':case 'week-prev':case 'week-next':{let date=new Date(s.selectedDate+'T12:00:00');let count=name.startsWith('week')?7:1;date.setDate(date.getDate()+(name.endsWith('next')?count:-count));s.selectedDate=iso(date);s.calMonth=s.selectedDate.slice(0,7);render();break}case 'budget-category':s.budgetCat=v;render();break;case 'budget-today':s.budgetMonth=iso(today).slice(0,7);s.budgetCat='all';render();break;case 'budget-prev':case 'budget-next':{let [yy,mm]=s.budgetMonth.split('-').map(Number);let d=new Date(yy,mm-1+(name==='budget-next'?1:-1),1);s.budgetMonth=iso(d).slice(0,7);s.budgetCat='all';render();break}case 'select-date':case 'cal-date':s.selectedDate=v;if(name==='cal-date')s.calMonth=v.slice(0,7);render();break;case 'chore-view':s.choreView=v;render();break;case 'cal-prev':case 'cal-next':{let [y,m]=s.calMonth.split('-').map(Number);let d=new Date(y,m-1+(name==='cal-next'?1:-1),1);s.calMonth=iso(d).slice(0,7);render();break}case 'note-view':s.noteView=v;render();break;case 'open-note':modal={type:'viewnote',id};render();break;case 'edit-note':modal={type:'editnote',id};render();break;case 'pin-note':{let n=s.notes.find(x=>x.id===id);if(n){n.pin=!n.pin;modal={type:'viewnote',id};render()}break}case 'delete-note':if(confirm('Usunąć tę notatkę?')){s.notes=s.notes.filter(n=>n.id!==id);modal=null;render();notify('Notatka usunięta')}break;case 'theme-preview':paletteScrollY=themeDrawer?(document.querySelector('.palette-scroll')?.scrollTop||0):0;s.previewTheme=v;render();break;case 'theme-save':if(s.previewTheme){s.theme=s.previewTheme;s.previewTheme=null;themeDrawer=false;render();notify('Motyw został zastosowany')}break;case 'toggle-notification':s.notifications[v]=!s.notifications[v];render();break;case 'toggle-text':s.textLarge=!s.textLarge;render();break;case 'toggle-role':s.role=isAdmin()?'member':'admin';render();notify('Podgląd roli: '+(isAdmin()?'Administrator':'Domownik'));break;case 'switch-member-role':{let p=s.members.find(x=>x.id===el.dataset.id);if(p&&isAdmin()){p.role=p.role==='admin'?'member':'admin';render();notify('Zmieniono rolę domownika')}break}case 'reset':if(confirm('Przywrócić wszystkie dane przykładowe i wygląd?')){s=initial();modal=null;render();notify('Makieta została zresetowana')}break;case 'copy-invite':{let code='DOM123';if(navigator.clipboard?.writeText){navigator.clipboard.writeText(code).then(()=>notify('Skopiowano przykładowy kod')).catch(()=>notify('Kod demonstracyjny: '+code))}else notify('Kod demonstracyjny: '+code);break}case 'welcome-prev':modal.step=Math.max(0,(modal.step||0)-1);render();break;case 'welcome-next':if((modal.step||0)>=2){modal=null;render()}else{modal.step=(modal.step||0)+1;render()}break}}
root.addEventListener('click',e=>{const row=e.target.closest('.shopping-row,.task-row,.task-detail-row');if(row&&!e.target.closest('button,a,input,select,textarea')){const cb=row.querySelector('.check:not([disabled])');if(cb){act(cb.dataset.action,cb);return}}let nav=e.target.closest('[data-nav]');if(nav){go(nav.dataset.nav);return}let op=e.target.closest('[data-open]');if(op){modal={type:op.dataset.open};s.showMore=false;render();return}let a=e.target.closest('[data-action]');if(a){act(a.dataset.action,a);return}});
root.addEventListener('keydown',e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('.shortcut-card')){e.preventDefault();go(e.target.dataset.nav)}if((e.key==='Enter'||e.key===' ')&&e.target.matches('.note-card')){e.preventDefault();act('open-note',e.target)}if(e.key==='Escape'&&themeDrawer){themeDrawer=false;s.previewTheme=null;render()}else if(e.key==='Escape'&&modal){modal=null;render()}});
root.addEventListener('input',e=>{if(e.target.id==='shopSearch'){s.searchShop=e.target.value;applySearches()}if(e.target.id==='noteSearch'){s.searchNote=e.target.value;applySearches()}});
root.addEventListener('submit',e=>{const form=e.target.closest('form[data-form]');if(!form)return;e.preventDefault();const fd=new FormData(form),g=k=>String(fd.get(k)||'').trim();const nid=()=>Date.now()+Math.floor(Math.random()*1000);switch(form.dataset.form){case 'shop-inline':if(!g('name')){notify('Wpisz nazwę produktu');return} s.shopping.unshift({id:nid(),name:g('name'),qty:'1 szt.',cat:'Inne',by:'Ty',checked:false});s.page='shopping';break;case 'shop':if(!g('name'))return;s.shopping.unshift({id:nid(),name:g('name'),qty:g('qty')||'1 szt.',cat:g('cat'),by:'Ty',checked:false});s.shopView='todo';s.page='shopping';break;case 'task':if(!isAdmin()||!g('title'))return;s.chores.push({id:nid(),title:g('title'),who:g('who'),date:g('date')||offset(0),time:g('time')||'10:00',done:false,icon:'check-square',repeat:g('repeat')});s.selectedDate=g('date')||offset(0);s.page='chores';s.choreView='all';break;case 'event':if(!g('title'))return;s.events.push({id:nid(),title:g('title'),date:g('date')||offset(0),time:g('time')||'14:00',end:'',private:g('visibility')==='private',by:'Ty',place:g('place')});s.selectedDate=g('date')||offset(0);s.calMonth=s.selectedDate.slice(0,7);s.page='calendar';break;case 'note':if(!g('title'))return;s.notes.unshift({id:nid(),title:g('title'),body:g('body'),by:'Ty',private:g('visibility')==='private',pin:false,tone:'sage'});s.noteView='all';s.page='notes';break;case 'expense':{if(!isAdmin())return;let a=Number(g('amount').replace(',','.'));if(!Number.isFinite(a)||a<=0)return notify('Podaj prawidłową kwotę');s.expenses.unshift({id:nid(),title:g('title'),amount:Math.round(a*100),cat:g('cat'),date:g('date')||offset(0),by:'Ty'});s.budgetMonth=(g('date')||offset(0)).slice(0,7);s.budgetCat='all';s.page='budget';break}case 'editnote':{let n=s.notes.find(x=>x.id===Number(form.dataset.id));if(n){n.title=g('title');n.body=g('body');n.private=g('visibility')==='private'}break}}
modal=null;render();notify(form.dataset.form==='shop-inline'||form.dataset.form==='shop'?'Dodano do listy':'Zapisano')});
document.addEventListener('click',e=>{if(e.target.id==='modalLayer'){modal=null;s.previewTheme=null;render()}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&modal){modal=null;render()}});
render();
const splash=document.createElement('div');splash.className='splash-screen';splash.setAttribute('aria-label','Uruchamianie PorządMisia');splash.innerHTML='<img src="assets/brand/mis-logo-384.png" width="118" height="118" alt="PorządMiś"><strong>PorządMiś</strong><span>Spokojniej w Twoim domu</span>';document.body.appendChild(splash);setTimeout(()=>{splash.classList.add('splash-hide');setTimeout(()=>splash.remove(),200)},850);
})();
</script>
